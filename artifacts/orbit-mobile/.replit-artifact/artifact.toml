kind = "mobile"
previewPath = "/orbit-mobile/"
title = "Orbit Mobile"
description = "A native iPhone companion for Orbit, a relationship-intelligence app. Lets users capture natural-language notes about people they meet, browse their people directory, view a person's full relationship history, get reminded when it's time to reconnect, and explore their network as a graph. Talks to the same Orbit API as the web app."
version = "1.0.0"
id = "artifacts/orbit-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/orbit-mobile/" ]
localPort = 21555

[services.development]
run = "pnpm --filter @workspace/orbit-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orbit-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/orbit-mobile", "run", "serve" ]

[services.env]
PORT = "21555"
BASE_PATH = "/orbit-mobile/"
