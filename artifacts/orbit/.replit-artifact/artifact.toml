kind = "web"
previewPath = "/"
title = "Orbit"
description = "A personal relationship intelligence app that helps one person remember their network, capture context quickly, explore connections, and reconnect with people at the right time."
version = "1.0.0"
id = "artifacts/orbit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22982

[services.development]
run = "pnpm --filter @workspace/orbit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orbit", "run", "build" ]
serve = "static"
publicDir = "artifacts/orbit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22982"
BASE_PATH = "/"
