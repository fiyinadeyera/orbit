openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: people
    description: People and relationship memory
  - name: capture
    description: Natural language capture
  - name: network
    description: Network views and reconnect prompts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List people
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: People matching the query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Add a person manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Person created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person and their relationship history
      responses:
        "200":
          description: Person detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetail"
        "404":
          description: Person not found
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person
      responses:
        "204":
          description: Person deleted
  /people/{id}/interactions:
    post:
      operationId: createInteraction
      tags: [people]
      summary: Add an interaction to a person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionInput"
      responses:
        "201":
          description: Interaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
  /capture/extract:
    post:
      operationId: extractCapture
      tags: [capture]
      summary: Run AI extraction on a note (voice transcript or typed) without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureExtractInput"
      responses:
        "201":
          description: Extracted relationship fields, ready for user review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureExtractResult"
  /capture/confirm:
    post:
      operationId: confirmCapture
      tags: [capture]
      summary: Save a (possibly user-edited) extracted entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureConfirmInput"
      responses:
        "201":
          description: Captured person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureConfirmResult"
  /people/import:
    post:
      operationId: importContacts
      tags: [people]
      summary: Bulk-import contacts into the network, skipping duplicates by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportContactsInput"
      responses:
        "201":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportContactsResult"
  /reconnects:
    get:
      operationId: listReconnects
      tags: [network]
      summary: List people who may be due for a reconnection
      responses:
        "200":
          description: Reconnect prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReconnectPrompt"
  /graph:
    get:
      operationId: getGraph
      tags: [network]
      summary: Get people and relationships for the network graph
      responses:
        "200":
          description: Network graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
  /intros:
    get:
      operationId: listIntros
      tags: [network]
      summary: Suggested introductions to make across the network
      responses:
        "200":
          description: Ranked introduction suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntroSuggestion"
  /ask:
    post:
      operationId: askNetwork
      tags: [network]
      summary: Answer a natural-language question about the network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: A grounded answer plus the people it refers to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"
components:
  schemas:
    AskInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1 }
    AskMatch:
      type: object
      required: [person, reason]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        reason: { type: string }
    AskResult:
      type: object
      required: [answer, matches]
      properties:
        answer: { type: string }
        matches:
          type: array
          items:
            $ref: "#/components/schemas/AskMatch"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Person:
      type: object
      required: [id, name, company, role, location, howMet, dateMet, notes, lookingFor, lastContacted, tags, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        company: { type: ["string", "null"] }
        role: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        howMet: { type: ["string", "null"] }
        dateMet: { type: ["string", "null"], format: date }
        notes: { type: ["string", "null"] }
        lookingFor: { type: ["string", "null"] }
        lastContacted: { type: ["string", "null"], format: date }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    PersonInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        role: { type: string }
        location: { type: string }
        howMet: { type: string }
        dateMet: { type: string, format: date }
        notes: { type: string }
        lookingFor: { type: string }
        tags:
          type: array
          items: { type: string }
    PersonUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        role: { type: string }
        location: { type: string }
        howMet: { type: string }
        dateMet: { type: string, format: date }
        notes: { type: string }
        lookingFor: { type: string }
        tags:
          type: array
          items: { type: string }
    Interaction:
      type: object
      required: [id, personId, date, summary, rawNote]
      properties:
        id: { type: string }
        personId: { type: string }
        date: { type: string, format: date }
        summary: { type: string }
        rawNote: { type: ["string", "null"] }
    InteractionInput:
      type: object
      required: [summary, date]
      properties:
        summary: { type: string, minLength: 1 }
        rawNote: { type: string }
        date: { type: string, format: date }
    Connection:
      type: object
      required: [id, personAId, personBId, relationshipType, notes]
      properties:
        id: { type: string }
        personAId: { type: string }
        personBId: { type: string }
        relationshipType: { type: string }
        notes: { type: ["string", "null"] }
    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [interactions, connections]
          properties:
            interactions:
              type: array
              items: { $ref: "#/components/schemas/Interaction" }
            connections:
              type: array
              items: { $ref: "#/components/schemas/Connection" }
    ExtractedRelationship:
      type: object
      required: [name, company, role, location, interests, connectedTo, context, date, status]
      properties:
        name: { type: string }
        company: { type: ["string", "null"] }
        role: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        interests:
          type: array
          items: { type: string }
        connectedTo:
          type: array
          items: { type: string }
        context: { type: ["string", "null"] }
        date: { type: string, format: date }
        status: { type: ["string", "null"] }
    CaptureExtractInput:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1 }
    CaptureExtractResult:
      type: object
      required: [extracted, isExistingPerson, rawNote]
      properties:
        extracted: { $ref: "#/components/schemas/ExtractedRelationship" }
        isExistingPerson: { type: boolean }
        rawNote: { type: string }
    CaptureConfirmInput:
      type: object
      required: [name, rawNote, date]
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        role: { type: string }
        location: { type: string }
        context: { type: string }
        interests:
          type: array
          items: { type: string }
        connectedTo:
          type: array
          items: { type: string }
        status: { type: string }
        date: { type: string, format: date }
        rawNote: { type: string, minLength: 1 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        forceNew:
          type: boolean
          description: >-
            When true, always save this as a brand-new person even if the
            name matches an existing contact, instead of merging into them.
    CaptureConfirmResult:
      type: object
      required: [person, created]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        created: { type: boolean }
    ReconnectPrompt:
      type: object
      required: [person, daysSinceContact, lastInteraction]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        daysSinceContact: { type: number, minimum: 0 }
        lastInteraction: { type: ["string", "null"] }
    ImportContact:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        company: { type: string }
        role: { type: string }
    ImportContactsInput:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items: { $ref: "#/components/schemas/ImportContact" }
    ImportContactsResult:
      type: object
      required: [imported, skipped, people]
      properties:
        imported: { type: number, minimum: 0 }
        skipped: { type: number, minimum: 0 }
        people:
          type: array
          items: { $ref: "#/components/schemas/Person" }
    IntroParty:
      type: object
      required: [id, name, role, company]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: ["string", "null"] }
        company: { type: ["string", "null"] }
    IntroSuggestion:
      type: object
      required: [personA, personB, score, rationale, draftIntro]
      properties:
        personA: { $ref: "#/components/schemas/IntroParty" }
        personB: { $ref: "#/components/schemas/IntroParty" }
        score: { type: number, minimum: 0, maximum: 100 }
        rationale: { type: string }
        draftIntro: { type: string }
    Graph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, name, company, initials, tags]
            properties:
              id: { type: string }
              name: { type: string }
              company: { type: ["string", "null"] }
              initials: { type: string }
              tags:
                type: array
                items: { type: string }
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Connection"

