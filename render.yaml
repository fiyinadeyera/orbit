# Render Blueprint for Orbit
#
# Two services:
#   orbit-api  - the Express API (Node), the backend both clients talk to
#   orbit-web  - the web app (static site) that proxies /api to orbit-api
#
# Secrets are NOT stored here. Env vars marked `sync: false` are set once in the
# Render dashboard on the orbit-api service (DATABASE_URL, the AI keys, EXA).
#
# To use: push this file, then in Render open the Blueprint and Sync.

services:
  - type: web
    name: orbit-api
    runtime: node
    plan: free # free spins down after ~15 min idle (cold start ~50s); bump to starter to keep warm
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/healthz
    # pnpm monorepo. Notes:
    # - strict-dep-builds=false: Render sets CI=true, which turns pnpm's
    #   "ignored build scripts" notice (esbuild's postinstall) into a hard
    #   failure. esbuild still runs fine from its platform binary package, so
    #   we allow the install to proceed.
    # - build/start call node directly instead of `pnpm run`, because pnpm's
    #   pre-run dependency check would re-run the install and fail the same way.
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@11.24.0 --activate &&
      pnpm install --frozen-lockfile --config.strict-dep-builds=false &&
      cd artifacts/api-server && node build.mjs
    startCommand: cd artifacts/api-server && node --enable-source-maps dist/index.mjs
    envVars:
      # Render provides PORT automatically; the server already reads process.env.PORT.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Non-secret defaults (safe to commit).
      - key: AI_INTEGRATIONS_ANTHROPIC_BASE_URL
        value: https://api.anthropic.com
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        value: https://api.openai.com/v1
      # Secrets: set these in the Render dashboard, not in this file.
      - key: DATABASE_URL
        sync: false
      - key: AI_INTEGRATIONS_ANTHROPIC_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false

  - type: web
    name: orbit-web
    runtime: static
    branch: main
    autoDeploy: true
    # Build the Vite web app. Notes:
    # - No `corepack enable` here: the static runtime's /usr/bin is read-only.
    #   Render already provides pnpm (pinned via the root packageManager field).
    # - typecheck:libs builds the workspace lib outputs the web bundle needs.
    # - PORT/BASE_PATH are required by vite.config.ts even at build time.
    buildCommand: >-
      pnpm install --frozen-lockfile --config.strict-dep-builds=false &&
      pnpm run typecheck:libs &&
      PORT=10000 BASE_PATH=/ pnpm --filter @workspace/orbit build
    staticPublishPath: artifacts/orbit/dist/public
    # /api is proxied to the API service so the browser stays same-origin
    # (keeps the session cookie working); everything else falls back to the
    # SPA entry so client-side routes resolve.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://orbit-api-z3y6.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
